<!DOCTYPE html>
<html>
<head>
    <title>RAG-research-papers</title>
    <link rel="stylesheet" type="text/css" href="../static/main.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>    
    <div style="display: flex; height: 100%; flex-direction: column;">
        <div class="static_title">
            <h1>RAG for research papers</h1>
            <hr style="width:100%; margin-bottom: 0;">
        </div>

        <div id="main_container">
            <div id="sidebar">
                <div class="sidebar_toolbar" title="Toolbar">
                    <button id="new_chat" class="sidebar_btn" title="Create New Chat"><img src="../static/icons/new_chat_btn.png" alt="New Chat" width="24" height="24"></button>
                    <button class="sidebar_btn" title="Settings"><img src="../static/icons/settings_icon.png" alt="Settings" width="24" height="24"></button>
                    <button class="sidebar_btn" title="Close Sidebar"><img src="../static/icons/sidebar_icon.png" alt="Close Sidebar" width="24" height="24"></button>
                </div>


            </div>

            <div class="container">
                <div class="upload_container">
                    <input type="file" id="file_input" accept=".pdf,application/pdf" hidden>
                    <button id="upload_btn">Upload PDF</button>
                    <div id="fileInfo"></div>
                    <div id="progress_container">
                        <div class="progress_left_col">
                            <span id="processed_file"></span>
                            
                            <div class="progress-wrapper">
                                <div class="progress_bg"></div>
                                <div id="progress_bar"></div>
                            </div>

                            <span id="progress_ws"></span>
                        </div>

                        <div class="progress_right_col">
                            <span id="progress_perc"></span>
                        </div>

                
                    </div>
                </div>
                
                <div class="chat_container">
                    <div id="chat">
                        <button id="download_chat" title="Download Chat"><img src="../static/icons/download_btn.png" alt="Download" width="24" height="24"></button>
                        <div id="msg_container"></div>
                    
                        <div id="controls">
                            <textarea id="message_area" placeholder="Input message ..."></textarea>
                            <button id="message_send_btn">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    


    <script type="text/javascript" src="../static/main.js"></script>
</body>
</html>
