<!DOCTYPE html>
<html>
<head>
    <title>RAG-research-papers</title>
    <link rel="stylesheet" type="text/css" href="../static/main.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>    
    <div class="container">
        <div class="static_title">
            <h1>RAG for research papers</h1>
            <hr style="width:95%;">
        </div>

        <div class="container">
            <div class="upload_container">
                <input type="file" id="file_input" accept=".pdf,application/pdf" hidden>
                <button id="upload_btn">Upload PDF</button>
                <div id="fileInfo"></div>
                <div id="progress_container">
                    <div class="div1">
                        <div class="top_row">
                            <span id="processed_file"></span>
                            <button id="reset_upload" title="New Upload"><img src="../static/icons/reset_btn.png" alt="Reset" width="24" height="24"></button>
                        </div>

                        <div class="progress-wrapper">
                            <div class="progress_bg"></div>
                            <div id="progress_bar"></div>
                        </div>

                        <span id="progress_ws"></span>
                    </div>

                    <div class="div2">
                        <span id="progress_perc"></span>
                    </div>

            
                </div>
            </div>
            
            <div class="chat_container">
                <div id="chat">
                    <div id="msg_container">
                    </div>
                
                    <div id="controls">
                        <textarea id="message_area" placeholder="Input message ..."></textarea>
                        <button id="message_send_btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    


    <script type="text/javascript" src="../static/main.js"></script>
</body>
</html>
